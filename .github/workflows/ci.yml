name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK components
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: googlePlay — assemble + unit tests
        run: ./gradlew :app:assembleGooglePlayDebug :app:testGooglePlayDebugUnitTest --no-daemon --console=plain

      - name: googlePlay — lint
        run: ./gradlew :app:lintGooglePlayDebug --no-daemon --console=plain

      - name: googlePlay — unsigned release (R8) assemble
        run: ./gradlew :app:assembleGooglePlayRelease --no-daemon --console=plain

      - name: amazon — assemble + unit tests
        run: ./gradlew :app:assembleAmazonDebug :app:testAmazonDebugUnitTest --no-daemon --console=plain

      - name: amazon — lint
        run: ./gradlew :app:lintAmazonDebug --no-daemon --console=plain