name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-lint-assemble:
    name: Unit tests, lint & assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform and build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Require DesignSystem composite
        run: |
          if [ ! -f DesignSystem/build.gradle.kts ]; then
            echo "::error::In-repo DesignSystem missing (composite include). Cannot build standalone."
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests (both flavors)
        run: ./gradlew --no-daemon --stacktrace :app:testGooglePlayDebugUnitTest :app:testAmazonDebugUnitTest

      - name: Lint (both flavors)
        # No lint baseline exists yet; report lint results without blocking.
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace :app:lintGooglePlayDebug :app:lintAmazonDebug

      - name: Assemble debug (both flavors)
        run: ./gradlew --no-daemon --stacktrace :app:assembleGooglePlayDebug :app:assembleAmazonDebug

      - name: Upload debug APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore

      - name: Upload test and lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: ignore
